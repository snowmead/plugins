[package]
name = "claude-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Runs the Claude pull request review in GitHub Actions and posts its result"
publish = false

# Its own workspace, so the action builds on its own wherever it lives.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Rustls with its webpki roots, so the binary needs no system TLS library.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
definition_in_module_root = "warn"
inline_modules = "warn"
missing_docs_in_private_items = "warn"
mod_module_files = "warn"
rest_pattern_accessible_field = "warn"
unnecessary_rest_pattern = "warn"

[lints.rust]
missing_docs = "warn"
raw_borrows_via_references = "warn"
unreachable_pub = "warn"
