name: Review skill

# Checks skills/review, the Claude pull request review: its Rust program
# (format, lint, tests, docs), its workflows under Node with stub agents, this
# repository's review job, and its locked crates against RustSec advisories.
# The weekly run catches an advisory published after the last change.

on:
  pull_request:
    paths:
      - skills/review/**
      - .github/workflows/review-skill.yml
      - .github/workflows/claude-review.yml
      - .github/tests/**
  push:
    branches: [main]
    paths:
      - skills/review/**
      - .github/workflows/review-skill.yml
      - .github/workflows/claude-review.yml
      - .github/tests/**
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skills/review
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      # The Rust tests run the workflows under Node too.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      # The release rust-toolchain.toml pins in skills/review.
      - name: Install the pinned Rust
        run: rustup toolchain install
      # Saved only from main, and only from a job that passed, so a branch or
      # a cancelled run never changes what later runs start from.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: skills/review -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - run: node --test 'workflows/tests/*.test.mjs'
      - name: The review job takes the action from a trusted branch
        working-directory: .
        run: node --test '.github/tests/*.test.mjs'

  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skills/review
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install cargo-deny
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          name="cargo-deny-$VERSION-x86_64-unknown-linux-musl"
          curl -fsSLo "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      # deny.toml in skills/review: no open advisory, crates only from crates.io.
      - run: cargo deny --locked check advisories sources
